<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シールPDF作成ツール</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    background: #f5f5f3;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 2rem 1rem;
    color: #1a1a1a;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    border: 0.5px solid #e0e0e0;
    padding: 2rem;
    width: 100%;
    max-width: 560px;
  }
  h1 { font-size: 17px; font-weight: 500; margin-bottom: 1.5rem; color: #111; }
  .field { margin-bottom: 14px; }
  label { display: block; font-size: 11px; color: #888; margin-bottom: 4px; letter-spacing: 0.03em; }
  input[type=text] {
    width: 100%; padding: 8px 10px; font-size: 13px;
    border: 0.5px solid #ddd; border-radius: 7px; outline: none;
    font-family: inherit; color: #111; background: #fff;
  }
  input[type=text]:focus { border-color: #888; }
  .btn {
    width: 100%; padding: 10px 0; font-size: 13px; font-weight: 500;
    border-radius: 7px; cursor: pointer; border: none;
    font-family: inherit; margin-top: 1.25rem;
    background: #111; color: #fff;
  }
  .btn:hover { opacity: 0.8; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .preview-section { margin-top: 1.5rem; }
  .tab-row {
    display: flex; border: 0.5px solid #e0e0e0;
    border-radius: 8px; overflow: hidden; margin-bottom: 10px;
  }
  .tab {
    flex: 1; padding: 7px 0; font-size: 12px; text-align: center;
    cursor: pointer; border: none; background: transparent; color: #888;
    font-family: inherit;
  }
  .tab.active { background: #111; color: #fff; font-weight: 500; }
  .preview-wrap { border: 0.5px solid #e0e0e0; border-radius: 10px; overflow: hidden; background: #fafafa; }
  .preview-header {
    padding: 8px 14px; font-size: 11px; color: #999;
    border-bottom: 0.5px solid #e0e0e0;
    display: flex; justify-content: space-between;
  }
  canvas { display: block; margin: 0 auto; max-width: 100%; }
  .dl-row { display: flex; gap: 8px; margin-top: 10px; }
  .dl-btn {
    flex: 1; padding: 8px 0; font-size: 12px; text-align: center;
    border: 0.5px solid #ddd; border-radius: 7px; cursor: pointer;
    background: #fff; color: #111; font-family: inherit;
  }
  .dl-btn:hover { background: #f5f5f5; }
  .status { font-size: 12px; color: #999; margin-top: 10px; text-align: center; min-height: 18px; }
  .status.error { color: #c0392b; }
  .status.success { color: #27ae60; }
  #bc-canvas { position: fixed; left: -9999px; top: -9999px; }
</style>
</head>
<body>
<div class="card">
  <h1>シールPDF作成ツール</h1>
  <div class="field">
    <label>OCRコード <span style="color:#bbb;font-weight:normal;">任意</span></label>
    <input type="text" id="ocr" value="FH0001990403000">
  </div>
  <div class="field">
    <label>商品名 <span style="color:#bbb;font-weight:normal;">任意</span></label>
    <input type="text" id="pname" value="●ﾐﾆｾｯﾄ ﾍﾞﾙﾒ/x3定期ｺｰｽﾌﾟﾚｾﾞﾝﾄ">
  </div>
  <div class="field">
    <label>JAN / 商品コード <span style="color:#c0392b;font-weight:normal;">必須</span> <span style="color:#bbb;">13桁数字→EAN13 / それ以外→CODE128</span></label>
    <input type="text" id="jan" value="2100034397362">
  </div>
  <button class="btn" id="gen-btn" onclick="generate()">プレビュー生成</button>

  <div class="preview-section" id="preview-area" style="display:none">
    <div class="tab-row">
      <button class="tab active" id="tab44" onclick="switchTab(44)">44面</button>
      <button class="tab" id="tab1" onclick="switchTab(1)">1面</button>
    </div>
    <div class="preview-wrap">
      <div class="preview-header">
        <span id="preview-label">プレビュー（44面）</span>
        <span id="preview-size">A4 / 48.3×25.4mm × 44</span>
      </div>
      <canvas id="cv"></canvas>
    </div>
    <div class="dl-row">
      <button class="dl-btn" onclick="downloadPDF(44)">⬇ 44面PDF</button>
      <button class="dl-btn" onclick="downloadPDF(1)">⬇ 1面PDF</button>
    </div>
  </div>
  <div class="status" id="status"></div>
</div>

<!-- バーコード生成用の非表示canvas -->
<canvas id="bc-canvas"></canvas>

<script>
const { jsPDF } = window.jspdf;
let currentTab = 44;
let barcodeDataUrl = null;
let bcHeightMM = 0;
const bcWidthMM = 42;

function setStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (type ? ' ' + type : '');
}

// JsBarcode を canvas に直接描画してDataURLを取得
function generateBarcode(jan) {
  var bc = document.getElementById('bc-canvas');
  try {
    var isEAN = /^\d{13}$/.test(jan);
    var opts = {
      format: isEAN ? 'EAN13' : 'CODE128',
      width: 1.8,
      height: 28,
      fontSize: 6,
      margin: 1,
      marginTop: 1,
      displayValue: true,
      background: '#ffffff',
      lineColor: '#000000'
    };
    if (isEAN) opts.valid = function(v) { return true; };
    JsBarcode(bc, jan, opts);
    barcodeDataUrl = bc.toDataURL('image/png');
    bcHeightMM = bcWidthMM * (bc.height / bc.width);
    return true;
  } catch(e) {
    console.error('barcode error:', e);
    return false;
  }
}

// テキストを折り返す（Canvas用）
function wrapText(ctx, text, maxWidth) {
  var chars = text.split('');
  var lines = [], line = '';
  for (var i = 0; i < chars.length; i++) {
    var test = line + chars[i];
    if (ctx.measureText(test).width > maxWidth && line !== '') {
      lines.push(line); line = chars[i];
    } else { line = test; }
  }
  if (line) lines.push(line);
  return lines;
}

// フォントサイズを自動調整してテキストを描画（Canvas用）
function drawFitText(ctx, text, cx, startY, maxW, maxH, baseFontSize) {
  var fontSize = baseFontSize;
  var lines, lineH;
  // フォントを縮小しながら収まるサイズを探す
  while (fontSize >= baseFontSize * 0.5) {
    ctx.font = fontSize + 'px sans-serif';
    lineH = fontSize * 1.3;
    lines = wrapText(ctx, text, maxW);
    if (lines.length * lineH <= maxH) break;
    fontSize -= 0.3;
  }
  ctx.font = fontSize + 'px sans-serif';
  lineH = fontSize * 1.3;
  lines = wrapText(ctx, text, maxW);
  var totalH = lines.length * lineH;
  var y = startY + (maxH - totalH) / 2;
  for (var i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], cx, y + lineH * i);
  }
}

function drawLabel(ctx, x, y, wPx, hPx, ocr, pname, scale) {
  ctx.textAlign = 'center';

  var maxW      = wPx * 0.92;
  var ocrFontPx = 3.0 * scale;
  var ocrLineH  = ocrFontPx * 1.4;
  var topPad    = 1.5 * scale;

  var bcW = wPx * 0.94;
  var bcH = barcodeDataUrl ? bcW * (bcHeightMM / bcWidthMM) : 0;
  var bcMarginBottom = 1.8 * scale;
  var bcMarginTop    = 1.5 * scale;
  var bcY = y + hPx - bcH - bcMarginBottom;

  var nameTop, nameBottom, nameAreaH;

  if (ocr) {
    var ocrY   = y + topPad + ocrLineH;
    nameTop    = ocrY + 1.5 * scale;
    nameBottom = bcY - bcMarginTop;
    nameAreaH  = Math.max(nameBottom - nameTop, 1);
    ctx.fillStyle = '#666';
    ctx.font = ocrFontPx + 'px sans-serif';
    ctx.fillText(ocr, x + wPx/2, ocrY);
  } else {
    nameTop    = y + topPad;
    nameBottom = bcY - bcMarginTop;
    nameAreaH  = Math.max(nameBottom - nameTop, 1);
  }

  ctx.fillStyle = '#222';
  drawFitText(ctx, pname, x + wPx/2, nameTop, maxW, nameAreaH, 4.0 * scale);

  // ---- バーコード描画 ----
  if (barcodeDataUrl) {
    var img = new Image();
    img.src = barcodeDataUrl;
    var bcX = x + (wPx - bcW) / 2;
    ctx.drawImage(img, bcX, bcY, bcW, bcH);
  }
}

function generate() {
  var ocr  = document.getElementById('ocr').value.trim();
  var pname = document.getElementById('pname').value.trim();
  var jan  = document.getElementById('jan').value.trim();

  if (!pname || !jan) {
    setStatus('商品名とJANを入力してください', 'error'); return;
  }
  if (!jan) {
    setStatus('JANを入力してください', 'error'); return;
  }

  document.getElementById('gen-btn').disabled = true;
  setStatus('生成中...');

  var ok = generateBarcode(jan);
  if (!ok) {
    setStatus('バーコード生成に失敗しました', 'error');
    document.getElementById('gen-btn').disabled = false;
    return;
  }

  document.getElementById('preview-area').style.display = 'block';
  renderPreview(currentTab, ocr, pname);
  setStatus('生成完了', 'success');
  document.getElementById('gen-btn').disabled = false;
}

function renderPreview(mode, ocr, pname) {
  var cv = document.getElementById('cv');
  var scale = 2.5;
  var lW = 48.3, lH = 25.4, mX = 8.4, mY = 8.8;

  cv.width  = mode === 44 ? Math.round(210*scale) : Math.round(lW*scale);
  cv.height = mode === 44 ? Math.round(297*scale) : Math.round(lH*scale);

  var ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, cv.width, cv.height);

  var lWpx = lW*scale, lHpx = lH*scale;
  if (mode === 44) {
    for (var r = 0; r < 11; r++)
      for (var c = 0; c < 4; c++)
        drawLabel(ctx, (mX+c*lW)*scale, (mY+r*lH)*scale, lWpx, lHpx, ocr, pname, scale);
  } else {
    drawLabel(ctx, 0, 0, lWpx, lHpx, ocr, pname, scale);
  }
}

function switchTab(mode) {
  currentTab = mode;
  document.getElementById('tab44').className = 'tab' + (mode===44 ? ' active' : '');
  document.getElementById('tab1').className  = 'tab' + (mode===1  ? ' active' : '');
  document.getElementById('preview-label').textContent = mode===44 ? 'プレビュー（44面）' : 'プレビュー（1面）';
  document.getElementById('preview-size').textContent  = mode===44 ? 'A4 / 48.3×25.4mm × 44' : '48.3×25.4mm';
  var ocr   = document.getElementById('ocr').value.trim();
  var pname = document.getElementById('pname').value.trim();
  if (barcodeDataUrl) renderPreview(mode, ocr, pname);
}

function downloadPDF(mode) {
  var ocr   = document.getElementById('ocr').value.trim();
  var pname = document.getElementById('pname').value.trim();
  if (!barcodeDataUrl) { setStatus('先にプレビュー生成してください', 'error'); return; }

  setStatus('PDF生成中...');
  var lW = 48.3, lH = 25.4, mX = 8.4, mY = 8.8;

  var doc = mode === 44
    ? new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' })
    : new jsPDF({ unit:'mm', format:[lW, lH] });

  function addLabel(x, y) {
    var pt2mm    = 0.3528;
    var ocrFsz   = 3.0;
    var ocrLineH = ocrFsz * pt2mm * 1.4;
    var topPad   = 0.5;

    var bcW      = lW * 0.94;
    var bcHmm    = bcW * (bcHeightMM / bcWidthMM);
    var bcMarginB = 1.8;
    var bcMarginT = 1.5;
    var bcY      = y + lH - bcHmm - bcMarginB;

    var nameTop, nameBottom, textAreaMm;

    if (ocr) {
      var ocrY   = y + topPad + ocrLineH;
      nameTop    = ocrY + 0.8;
      nameBottom = bcY - bcMarginT;
      textAreaMm = Math.max(nameBottom - nameTop, 1);
      doc.setFontSize(ocrFsz);
      doc.setTextColor(80);
      doc.text(ocr, x + lW/2, ocrY, { align:'center' });
    } else {
      nameTop    = y + topPad;
      nameBottom = bcY - bcMarginT;
      textAreaMm = Math.max(nameBottom - nameTop, 1);
    }

    // ---- 商品名（フォント自動縮小＋折り返し） ----
    var pfSize = 4.0;
    var plines;
    while (pfSize >= 2.0) {
      doc.setFontSize(pfSize);
      plines = doc.splitTextToSize(pname, lW * 0.92);
      var lineH = pfSize * pt2mm * 1.4;
      if (plines.length * lineH <= textAreaMm) break;
      pfSize -= 0.15;
    }
    doc.setFontSize(pfSize);
    doc.setTextColor(40);
    var lineH    = pfSize * pt2mm * 1.4;
    var totalH   = plines.length * lineH;
    var py       = nameTop + (textAreaMm - totalH) / 2 + lineH * 0.75;
    for (var pi = 0; pi < plines.length; pi++) {
      doc.text(plines[pi], x + lW/2, py + pi * lineH, { align:'center' });
    }

    // ---- バーコード ----
    doc.addImage(barcodeDataUrl, 'PNG', x + (lW - bcW)/2, bcY, bcW, bcHmm);
  }

  if (mode === 44) {
    for (var r = 0; r < 11; r++)
      for (var c = 0; c < 4; c++)
        addLabel(mX+c*lW, mY+r*lH);
    doc.save('sticker_44.pdf');
  } else {
    addLabel(0, 0);
    doc.save('sticker_1.pdf');
  }
  setStatus('PDFをダウンロードしました', 'success');
}
</script>
</body>
</html>
